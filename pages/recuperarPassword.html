<!DOCTYPE html>

  <html lang="es"> <!-- Documento HTML5 en español -->
    <head>
      <!-- Configuración de caracteres (permite tildes, ñ, etc.) -->
      <meta charset="UTF-8" />

      <!-- Hace que el diseño sea adaptable a dispositivos móviles -->
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />

      <!-- Título de la página -->
      <title>Serviarpe S.A.S - Recuperar Contraseña</title>

      <!-- ================= ESTILOS ================= -->
      <!-- Estilos específicos de esta vista -->
      <link rel="stylesheet" href="../asset/css/estilos_recuperarPassword.css" />

      <!-- Estilos reutilizables -->
      <link rel="stylesheet" href="../asset/utils/styles.css">

      <!-- Fuente tipográfica -->
      <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet" />
    </head>

    <body>

      <!-- Fondo visual -->
      <div class="fondo"></div>

      <!-- ================= CONTENEDOR PRINCIPAL ================= -->
      <!-- Layout dividido en logo (izquierda) y formulario (derecha) -->
      <div class="login">

        <!-- Panel de logo -->
        <div class="panel-logo">
          <div class="logo-circle">
            <img 
              src="../asset/imagenes/Logo_Serviarpe.png" 
              alt="Serviarpe S.A.S ESP" 
              class="logo-img" 
            />
          </div>
        </div>

        <!-- Separador visual -->
        <div class="divider"></div>

        <!-- ================= FORMULARIO ================= -->
        <div class="panel-form">

          <!-- Título -->
          <h3 class="form-title">Recuperar Contraseña</h3>

          <!-- ================================================= -->
          <!-- PASO 1: SOLICITAR CORREO -->
          <!-- ================================================= -->
          <div id="paso-1">

            <!-- Descripción del proceso -->
            <p class="descripcion">
              Ingresa tu correo electrónico y te enviaremos un código de verificación
              de 6 dígitos para restablecer tu contraseña.
            </p>

            <!-- Formulario para enviar código -->
            <form class="login-form" onsubmit="event.preventDefault(); enviarCodigo()">

              <!-- Campo de correo -->
              <div class="input-group">
                <input 
                  type="email" 
                  id="correo" 
                  placeholder="Correo electrónico" 
                  autocomplete="off"
                  required 
                />
              </div>

              <!-- Mensaje global dinámico: Se usa para mostrar errores o confirmaciones desde JS.  -->
              <p id="mensaje" class="mensaje"></p>

              <!-- Botón para solicitar código -->
              <button type="submit" id="btn-enviar" class="btn-principal">  Enviar código </button>

              <!-- Navegación -->
              <div class="container-link">
                <p class="link-inferior">
                  ← <a href="../index.html">Volver al inicio</a>
                </p>
              </div>

            </form>
          </div>

          <!-- ================================================= -->
          <!-- PASO 2: VALIDAR CÓDIGO Y CAMBIAR CONTRASEÑA -->
          <!-- ================================================= -->
          <!-- Se muestra dinámicamente desde JS -->
          <div id="paso-2" style="display:none;">

            <p class="descripcion"> Ingresa el código de 6 dígitos que enviamos a tu correo y elige una nueva contraseña. </p>

            <!-- Formulario de cambio de contraseña -->
            <form class="login-form" onsubmit="event.preventDefault(); cambiarPassword()">

              <!-- Código de verificación -->
              <div class="input-group">
                <input 
                  type="text" 
                  id="codigo" 
                  placeholder="Código de verificación" 
                  maxlength="6" 
                  autocomplete="off" 
                />
              </div>

              <!-- Nueva contraseña -->
              <div class="input-group">
                <input 
                  type="password" 
                  id="nueva-password" 
                  placeholder="Nueva contraseña"
                  minlength="6"
                  required
                />
              </div>

              <!-- Confirmación -->
              <div class="input-group">
                <input 
                  type="password" 
                  id="confirmar-password" 
                  placeholder="Confirmar nueva contraseña" 
                  minlength="6"
                  required
                />
              </div>

              <!-- Acción principal -->
              <button type="submit" class="btn-principal">  Cambiar contraseña  </button>

              <!-- Reenvío de código -->
              <div class="container-link">
                <button type="button" class="btn-secundario" onclick="reenviarCodigo()" > Reenviar código </button>
              </div>

            </form>
          </div>
        </div>
      </div>

      <!-- ================= SCRIPTS ================= -->
      <!-- Lógica del flujo de recuperación -->
      <script src="../asset/js/recuperarPassword.js"></script>

    </body>
  </html>
