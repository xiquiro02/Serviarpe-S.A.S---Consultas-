<!DOCTYPE html> 
  <html lang="es"> <!-- Define el idioma en español para mejorar accesibilidad. -->
    <head>
      <!-- Configuración de caracteres (permite tildes, ñ, etc.) -->
      <meta charset="UTF-8" />

      <!-- Hace que el diseño sea adaptable a dispositivos móviles -->
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />

      <!-- Título de la pestaña del navegador -->
      <title>Serviarpe S.A.S</title>

      <!-- PWA -->
      <link rel="manifest" href="manifest.json" />
      <meta name="theme-color" content="#0e270b" />

      <!-- Hoja de estilos principal -->
      <link rel="stylesheet" href="asset/estilo_principal.css" />

      <!-- Hoja de estilos reutilizable (utilidades generales) -->
      <link rel="stylesheet" href="asset/utils/styles.css">

      <!-- Fuente Montserrat desde Google Fonts -->
      <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet" />
    </head>

    <body>

      <!-- Fondo visual de la página. Se maneja desde CSS (imagen o degradado). -->
      <div class="fondo"></div> 

      <!-- Contenedor principal del login. Divide la interfaz en dos secciones: logo y formulario. -->
      <div class="login">

        <!-- ================= PANEL IZQUIERDO ================= -->
        <!-- Contiene el logo de la empresa -->
        <div class="panel-logo">
          <div class="logo-circle">
            <!-- Imagen del logo -->
            <img 
              src="asset/imagenes/Logo_Serviarpe.png" 
              alt="Serviarpe S.A.S ESP" 
              class="logo-img" 
            />
          </div>
        </div>

        <!-- Línea divisoria entre logo y formulario -->
        <div class="divider"></div>

        <!-- ================= PANEL DERECHO ================= -->
        <!-- Contiene el formulario de inicio de sesión -->
        <div class="panel-form">
          
          <!-- Título principal -->
          <h2 class="title">Bienvenidos a Serviarpe S.A.S</h2>

          <!-- Subtítulo del formulario -->
          <h3 class="form-title">Iniciar Sesión</h3>

          <!-- Formulario de login -->
          <form class="login-form">

            <!-- Campo de usuario -->
            <div class="input-group">
              <input 
                type="text" 
                id="usuario" 
                placeholder="Usuario" 
                autocomplete="off" 
              />
            </div>

            <!-- Campo de contraseña -->
            <div class="input-group">
              <input 
                type="password" 
                id="contrasena" 
                placeholder="Contraseña" 
                autocomplete="off" 
              />
            </div>

            <!-- Enlace para recuperación de contraseña -->
            <p class="forgot-password"> 
              <a href="pages/recuperarPassword.html"> ¿Olvidó su contraseña? </a> 
            </p>

            <!-- Botón de inicio de sesión. Ejecuta la función iniciarSesion() definida en login.js Nota: Se recomienda usar type="button" para evitar envío automático del formulario. -->
            <button type="button" onclick="iniciarSesion()" class="btn-ingresar"> Ingresar </button>

            <!-- Enlace a registro de usuario -->
            <p class="register"> No tienes cuenta? 
              <a href="pages/registrarse.html">Regístrate</a>
            </p>
          </form>
        </div>
      </div>

      <!-- ================= SCRIPTS ================= -->
      <!-- Librería SweetAlert2 para alertas personalizadas -->
      <script src="node_modules/sweetalert2/dist/sweetalert2.all.min.js"></script>
      <script src="services/auth.service.js"></script>
      <!-- Script principal del login -->
      <script src="js/login.js"></script>

      <!-- Registro del Service Worker (PWA) -->
      <script>
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('/service-worker.js');
        }
      </script>

    </body>
  </html>
