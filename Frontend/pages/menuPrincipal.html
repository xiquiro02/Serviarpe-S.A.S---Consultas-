<!DOCTYPE html>

  <html lang="es"> <!-- Documento HTML5 en español -->
  <head>
    <!-- Configuración de caracteres (permite tildes, ñ, etc.) -->
    <meta charset="UTF-8" />

    <!-- Hace que el diseño sea adaptable a dispositivos móviles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Título -->
    <title>Serviarpe S.A.S - Dashboard</title>

    <!-- PWA -->
    <link rel="manifest" href="../manifest.json" />
    <meta name="theme-color" content="#0e270b" />

    <!-- ================= ESTILOS ================= -->
    <!-- Variables globales (colores, tamaños, etc.) -->
    <link rel="stylesheet" href="../asset/utils/customProperties.css" />

    <!-- Estilos del sidebar -->
    <link rel="stylesheet" href="../asset/layout/sidebar.css" />

    <!-- Estilos específicos del dashboard -->
    <link rel="stylesheet" href="../asset/css/estilos_menuPrincipal.css" />

    <!-- Fuente -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet" />
  </head>

  <!-- Clase general aplicada al body -->
  <body class="general">

    <!-- ================= OVERLAY ================= -->
    <!-- Fondo oscuro que aparece cuando el menú lateral está abierto en móviles. -->
    <div class="overlay" id="overlay" onclick="cerrarMenu()"></div>

    <!-- ================= SIDEBAR ================= -->
    <!-- Menú lateral de navegación del sistema. -->
    <aside class="sidebar" id="sidebar">

      <!-- Encabezado -->
      <div class="sidebar-header">
        <img src="../asset/imagenes/logo_serviarpe.png" alt="Logo" />
        <span class="sidebar-nombre">SERVIARPE S.A.S ESP</span>
      </div>

      <!-- Sección GENERAL -->
      <p class="sidebar-seccion">GENERAL</p>
      <nav class="sidebar-nav">

        <!-- Página actual -->
        <a href="#" class="nav-item active">
          <span class="nav-icon">🏠</span> Inicio
        </a>

        <!-- Navegación -->
        <a href="buscarPersonal.html" class="nav-item">
          <span class="nav-icon">👤</span> Buscar personal
        </a>
      </nav>

      <!-- Sección LIBROS (dinámica) -->
      <p class="sidebar-seccion">LIBROS</p>
      <nav class="sidebar-nav" id="sidebarLibros">
        <!-- Se llena desde JS -->
      </nav>

      <!-- Sección ADMINISTRAR (solo admin) -->
      <p class="sidebar-seccion admin-only">ADMINISTRAR</p>
      <nav class="sidebar-nav admin-only">

        <a href="administrarUsuarios.html" class="nav-item">
          <span class="nav-icon">👥</span> Usuarios
        </a>

        <a href="administrarLibros.html" class="nav-item">
          <span class="nav-icon">📚</span> Libros
        </a>

        <a href="administrarCajas.html" class="nav-item">
          <span class="nav-icon">📦</span> Cajas
        </a>

        <a href="administrarYears.html" class="nav-item">
          <span class="nav-icon">📅</span> Años
        </a>

      </nav>

      <!-- Perfil -->
      <a href="perfil.html" class="sidebar-footer">
        <span class="user-icon">👤</span>
        <span class="user-nombre">Administrador</span>
      </a>

    </aside>

    <!-- ================= CONTENIDO PRINCIPAL ================= -->
    <div class="main">

      <!-- Barra superior -->
      <header class="topbar">
        <div class="topbar-center">
          <img src="../asset/imagenes/logo_serviarpe.png" alt="Logo" class="topbar-logo" />
          <h1 class="topbar-title">SERVIARPE S.A.S ESP</h1>
        </div>
      </header>

      <!-- CONTENIDO -->
      <main class="contenido">

        <!-- Botón hamburguesa -->
        <button class="hamburger" id="btnMenu" onclick="toggleMenu()">
          <span></span>
          <span></span>
          <span></span>
        </button>

        <!-- ======================= RESUMEN ========================== -->
        <div class="resumen">

          <!-- Total de registros -->
          <div class="card-resumen azul">
            <span class="card-numero" id="numCarpetas">—</span>
            <span class="card-label">Total de Personal Retirado</span>
          </div>

          <!-- Total de cajas -->
          <div class="card-resumen verde">
            <span class="card-numero" id="numCajas">—</span>
            <span class="card-label">Total de Cajas</span>
          </div>

          <!-- Rango de años -->
          <div class="card-resumen naranja">
            <span class="card-numero" id="rangoAnios">—</span>
            <span class="card-label">Años</span>
          </div>

        </div>

        <!-- ======================= GRID DE LIBROS ========================== -->
        <!-- Contenedor dinámico generado desde menuPrincipal.js -->
        <div class="libros-grid" id="librosGrid">
        </div>

      </main>
    </div>

    <!-- ================= SCRIPTS ================= -->
    <script src="../js/api.js"></script>
    <script src="../services/libros.service.js"></script>
    <script src="../services/personal.service.js"></script>
    <script src="../services/cajas.service.js"></script>
    <script src="../services/anios.service.js"></script>
    <!-- Control del menú -->
    <script src="../js/hamburger.js"></script>
    <!-- Lógica del sidebar -->
    <script src="../js/sidebar.js"></script>
    <!-- Lógica del dashboard (datos, métricas, render dinámico) -->
    <script src="../js/menuPrincipal.js"></script>

  </body>
  </html>
